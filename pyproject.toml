[project]
name = "fdf-python"
version = "1.0.0"
description = "FdF: каркасная 3D-модель карты высот в изометрической проекции"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pygame-ce>=2.5"]

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
